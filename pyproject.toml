[project]
name = "vrgen"
version = "0.1.0"
description = "视频生成服务：mglc(Seedance) 与手动注册双后端，统一轮次台账"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
vrgen = "vrgen.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008：typer 的 Option/Argument 在默认值位置调用是该库的官方惯用法
ignore = ["B008"]
